name: Verify topic purge truncation

on:
  push:
    branches: [verify/topic-purge-truncation]
  pull_request:
    branches: [main, develop]

env:
  CARGO_TERM_COLOR: always
  SQLX_OFFLINE: "true"
  DATABASE_URL: mysql://root:111@localhost:6001/memoria_test
  EMBEDDING_PROVIDER: ${{ secrets.EMBEDDING_API_KEY != '' && 'openai' || 'mock' }}
  EMBEDDING_API_KEY: ${{ secrets.EMBEDDING_API_KEY }}
  EMBEDDING_BASE_URL: ${{ vars.EMBEDDING_BASE_URL || '' }}
  EMBEDDING_MODEL: ${{ vars.EMBEDDING_MODEL || 'BAAI/bge-m3' }}
  EMBEDDING_DIM: ${{ vars.EMBEDDING_DIM || '1024' }}
  LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
  LLM_BASE_URL: ${{ vars.LLM_BASE_URL || '' }}
  LLM_MODEL: ${{ vars.LLM_MODEL || '' }}

jobs:
  check:
    name: Check & Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 3
      - uses: dtolnay/rust-toolchain@1.85.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: memoria
          shared-key: memoria-check
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Check & Clippy
        run: cd memoria && cargo check && cargo clippy -- -D warnings

  test-unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 3
      - uses: dtolnay/rust-toolchain@1.85.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: memoria
          shared-key: memoria-check
          save-if: false
      - name: Unit tests
        run: cd memoria && cargo test --lib -p memoria-api -p memoria-core -p memoria-service -p memoria-mcp

  test-db:
    name: DB Tests
    runs-on: ubuntu-latest
    needs: [check, test-unit]
    services:
      matrixone:
        image: matrixorigin/matrixone:latest
        ports:
          - 6001:6001
        options: --memory=4g
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 3
      - uses: dtolnay/rust-toolchain@1.85.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: memoria
          shared-key: memoria-check
          save-if: false
      - name: Wait for MatrixOne
        run: |
          for i in $(seq 1 30); do
            bash -c 'echo > /dev/tcp/127.0.0.1/6001' 2>/dev/null && break
            echo "Waiting... ($i/30)" && sleep 3
          done
      - name: Topic purge baseline regression
        run: |
          set -euo pipefail
          source_file=memoria/crates/memoria-storage/src/store.rs
          cp "$source_file" /tmp/topic-fixed.rs
          trap 'cp /tmp/topic-fixed.rs "$source_file"' EXIT
          git show cb38fec1cf15a3be30f8afccff31c0506bbe41d5:"$source_file" > "$source_file"
          set +e
          (cd memoria && cargo test -p memoria-storage --test store_crud test_topic_purge_fallback_exceeds_500_matches -- --exact --nocapture) > /tmp/topic-red.log 2>&1
          result=$?
          set -e
          cat /tmp/topic-red.log
          test "$result" -ne 0
          grep -F 'topic purge must not silently truncate matches at 500' /tmp/topic-red.log
          grep -F '0 passed; 1 failed;' /tmp/topic-red.log
      - name: Topic purge fixed regression
        run: cd memoria && cargo test -p memoria-storage --test store_crud test_topic_purge_fallback_exceeds_500_matches -- --exact --nocapture
      - name: All tests
        run: cd memoria && cargo test -- --test-threads=1
      - name: Restore transaction failure regression
        run: cd memoria && cargo test -p memoria-git --lib failed_insert_rolls_back_preceding_delete -- --ignored --nocapture
      - name: Branch capability probe cleanup regression
        run: cd memoria && cargo test -p memoria-storage --lib materialized_probe_cleanup_preserves_unrelated_tables -- --ignored --nocapture
      - name: Offline restore cleanup regressions
        run: cd memoria && cargo test -p memoria-git --example restore_cleanup -- --include-ignored --nocapture
