name: Verify MCP memory type validation

# 由 LW 授权的 ChatGPT Personal 智能体提交。
on:
  push:
    branches: [verify/211-fixed]
permissions:
  contents: read

env:
  FIX_PATCH_B64: 
  CARGO_TERM_COLOR: always
  SQLX_OFFLINE: "true"
  DATABASE_URL: mysql://root:111@localhost:6001/memoria_test
  EMBEDDING_PROVIDER: ${{ secrets.EMBEDDING_API_KEY != '' && 'openai' || 'mock' }}
  EMBEDDING_API_KEY: ${{ secrets.EMBEDDING_API_KEY }}
  EMBEDDING_BASE_URL: ${{ vars.EMBEDDING_BASE_URL || '' }}
  EMBEDDING_MODEL: ${{ vars.EMBEDDING_MODEL || 'BAAI/bge-m3' }}
  EMBEDDING_DIM: ${{ vars.EMBEDDING_DIM || '1024' }}
  LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
  LLM_BASE_URL: ${{ vars.LLM_BASE_URL || '' }}
  LLM_MODEL: ${{ vars.LLM_MODEL || '' }}

jobs:
  check:
    name: Check & Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Apply reviewed candidate
        run: |
          printf '%s' "$FIX_PATCH_B64" | base64 -d > "$RUNNER_TEMP/candidate.patch"
          git apply "$RUNNER_TEMP/candidate.patch"
      - uses: dtolnay/rust-toolchain@1.85.0
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: memoria
          shared-key: memoria-check
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Format and scope guard
        run: |
          set -euo pipefail
          rustfmt --edition 2021 memoria/crates/memoria-mcp/src/tools.rs memoria/crates/memoria-mcp/src/server.rs memoria/crates/memoria-mcp/tests/tools_unit.rs
          rustfmt --edition 2021 --check memoria/crates/memoria-mcp/src/tools.rs memoria/crates/memoria-mcp/src/server.rs memoria/crates/memoria-mcp/tests/tools_unit.rs
          git diff --check
          test "$(git diff --name-only | wc -l)" -eq 3
          git diff --numstat > "$RUNNER_TEMP/numstat.txt"
          python3 -c 'import os; s=sum(sum(map(int,x.split()[:2])) for x in open(os.environ["RUNNER_TEMP"]+"/numstat.txt")); assert s<=1000, s'
      - name: Check & Clippy
        run: cd memoria && cargo check && cargo clippy -- -D warnings

      - name: Preserve formatted candidate
        if: always()
        run: |
          mkdir -p evidence/source
          cp memoria/crates/memoria-mcp/src/tools.rs memoria/crates/memoria-mcp/src/server.rs memoria/crates/memoria-mcp/tests/tools_unit.rs evidence/source/
          git diff > evidence/candidate.patch
          git diff --numstat > evidence/numstat.txt
          git rev-parse HEAD > evidence/verification-head.txt
          sha256sum evidence/source/* > evidence/sha256.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: memory-type-211-${{ github.job }}
          path: evidence

  test-unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Apply reviewed candidate
        run: |
          printf '%s' "$FIX_PATCH_B64" | base64 -d > "$RUNNER_TEMP/candidate.patch"
          git apply "$RUNNER_TEMP/candidate.patch"
      - uses: dtolnay/rust-toolchain@1.85.0
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: memoria
          shared-key: memoria-check
          save-if: false
      - name: Format and scope guard
        run: |
          set -euo pipefail
          rustfmt --edition 2021 memoria/crates/memoria-mcp/src/tools.rs memoria/crates/memoria-mcp/src/server.rs memoria/crates/memoria-mcp/tests/tools_unit.rs
          rustfmt --edition 2021 --check memoria/crates/memoria-mcp/src/tools.rs memoria/crates/memoria-mcp/src/server.rs memoria/crates/memoria-mcp/tests/tools_unit.rs
          git diff --check
          test "$(git diff --name-only | wc -l)" -eq 3
          git diff --numstat > "$RUNNER_TEMP/numstat.txt"
          python3 -c 'import os; s=sum(sum(map(int,x.split()[:2])) for x in open(os.environ["RUNNER_TEMP"]+"/numstat.txt")); assert s<=1000, s'
      - name: Focused public tool and dispatch regressions
        run: |
          cd memoria
          cargo test --locked -p memoria-mcp --test tools_unit -- --nocapture
          cargo test --locked -p memoria-mcp --lib server::tests::tool_errors_are_results_in_both_dispatch_paths -- --nocapture
      - name: Unit tests
        run: cd memoria && cargo test --lib -p memoria-api -p memoria-core -p memoria-service -p memoria-mcp

      - name: Preserve formatted candidate
        if: always()
        run: |
          mkdir -p evidence/source
          cp memoria/crates/memoria-mcp/src/tools.rs memoria/crates/memoria-mcp/src/server.rs memoria/crates/memoria-mcp/tests/tools_unit.rs evidence/source/
          git diff > evidence/candidate.patch
          git diff --numstat > evidence/numstat.txt
          git rev-parse HEAD > evidence/verification-head.txt
          sha256sum evidence/source/* > evidence/sha256.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: memory-type-211-${{ github.job }}
          path: evidence

  test-db:
    name: DB Tests
    runs-on: ubuntu-latest
    needs: [check, test-unit]
    services:
      matrixone:
        image: matrixorigin/matrixone:latest
        ports:
          - 6001:6001
        options: --memory=4g
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Apply reviewed candidate
        run: |
          printf '%s' "$FIX_PATCH_B64" | base64 -d > "$RUNNER_TEMP/candidate.patch"
          git apply "$RUNNER_TEMP/candidate.patch"
      - uses: dtolnay/rust-toolchain@1.85.0
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: memoria
          shared-key: memoria-check
          save-if: false
      - name: Format and scope guard
        run: |
          set -euo pipefail
          rustfmt --edition 2021 memoria/crates/memoria-mcp/src/tools.rs memoria/crates/memoria-mcp/src/server.rs memoria/crates/memoria-mcp/tests/tools_unit.rs
          rustfmt --edition 2021 --check memoria/crates/memoria-mcp/src/tools.rs memoria/crates/memoria-mcp/src/server.rs memoria/crates/memoria-mcp/tests/tools_unit.rs
          git diff --check
          test "$(git diff --name-only | wc -l)" -eq 3
          git diff --numstat > "$RUNNER_TEMP/numstat.txt"
          python3 -c 'import os; s=sum(sum(map(int,x.split()[:2])) for x in open(os.environ["RUNNER_TEMP"]+"/numstat.txt")); assert s<=1000, s'
      - name: Wait for MatrixOne
        run: |
          for i in $(seq 1 30); do
            bash -c 'echo > /dev/tcp/127.0.0.1/6001' 2>/dev/null && break
            echo "Waiting... ($i/30)" && sleep 3
          done
      - name: All tests
        run: cd memoria && cargo test -- --test-threads=1
      - name: Restore transaction failure regression
        run: cd memoria && cargo test -p memoria-git --lib failed_insert_rolls_back_preceding_delete -- --ignored --nocapture
      - name: Branch capability probe cleanup regression
        run: cd memoria && cargo test -p memoria-storage --lib materialized_probe_cleanup_preserves_unrelated_tables -- --ignored --nocapture
      - name: Offline restore cleanup regressions
        run: cd memoria && cargo test -p memoria-git --example restore_cleanup -- --include-ignored --nocapture

      - name: Preserve formatted candidate
        if: always()
        run: |
          mkdir -p evidence/source
          cp memoria/crates/memoria-mcp/src/tools.rs memoria/crates/memoria-mcp/src/server.rs memoria/crates/memoria-mcp/tests/tools_unit.rs evidence/source/
          git diff > evidence/candidate.patch
          git diff --numstat > evidence/numstat.txt
          git rev-parse HEAD > evidence/verification-head.txt
          sha256sum evidence/source/* > evidence/sha256.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: memory-type-211-${{ github.job }}
          path: evidence
