name: Reproduce invalid memory type storage
# 由 LW 授权的 ChatGPT Personal 智能体提交。
on:
  push:
    branches: [verify/211-baseline]
permissions:
  contents: read
jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SQLX_OFFLINE: 'true'
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.85.0
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: memoria
          shared-key: memoria-check
          save-if: false
      - name: Apply regression tests only
        run: |
          echo  | base64 -d > "$RUNNER_TEMP/tests.patch"
          git apply "$RUNNER_TEMP/tests.patch"
          rustfmt --edition 2021 memoria/crates/memoria-mcp/tests/tools_unit.rs
      - name: Prove public tool stores invalid type before fix
        working-directory: memoria
        run: |
          set -euo pipefail
          status=0
          cargo test --locked -p memoria-mcp --test tools_unit test_tool_memory_store_ -- --nocapture > ../baseline.log 2>&1 || status=$?
          cat ../baseline.log
          test "$status" -ne 0
          grep -F 'test_tool_memory_store_rejects_invalid_memory_types ... FAILED' ../baseline.log
          grep -F 'invalid type must be rejected:' ../baseline.log
          grep -F 'persisted_types=["semantic"]' ../baseline.log
          grep -F 'test_tool_memory_store_keeps_valid_and_default_memory_types ... ok' ../baseline.log
      - name: Preserve tests and failure evidence
        if: always()
        run: |
          mkdir -p evidence
          cp memoria/crates/memoria-mcp/tests/tools_unit.rs evidence/tools_unit.rs
          cp baseline.log evidence/ 2>/dev/null || true
          git diff > evidence/tests.patch
          git diff --numstat > evidence/numstat.txt
          git rev-parse HEAD > evidence/verification-head.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: memory-type-211-baseline
          path: evidence
